<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mod Platform</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">CheeksUnseen</div><button id="logout" class="hidden">Log out</button></header>
<main><section id="loginView" class="card"><h1>Admin</h1><form id="login"><input id="username" placeholder="Username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button>Sign in</button><p id="loginError"></p></form></section>
<section id="appView" class="hidden"><div class="hero"><h1>Control panel</h1><p>Manage your mods and project resources.</p></div><div class="grid">
<div class="card"><h2>Mods</h2><form data-type="mods"><input name="name" placeholder="Name"><input name="version" placeholder="Version"><input name="url" placeholder="Download / page URL"><button>Add mod</button></form><div id="mods"></div></div>
<div class="card"><h2>Tutorials</h2><form data-type="tutorials"><input name="title" placeholder="Title"><input name="url" placeholder="URL"><button>Add tutorial</button></form><div id="tutorials"></div></div>
<div class="card"><h2>Links</h2><form data-type="links"><input name="name" placeholder="Name"><input name="url" placeholder="URL"><button>Add link</button></form><div id="links"></div></div>
<div class="card"><h2>Contributors</h2><form data-type="contributors"><input name="name" placeholder="Name"><input name="url" placeholder="Profile / URL"><button>Add contributor</button></form><div id="contributors"></div></div>
<div class="card"><h2>Tokens</h2><form id="tokenForm"><input name="name" placeholder="Token name"><button>Create token</button></form><div id="tokenOutput"></div><div id="tokens"></div></div>
</div></section></main><script src="/app.js"></script></body></html>
